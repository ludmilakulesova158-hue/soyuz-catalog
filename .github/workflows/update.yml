name: update-catalog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Convert feed
        env:
          FEED_URL: https://joywork.ru/feeds/14794.xml
        run: node scripts/convert.mjs

      - name: Commit if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes in data"
          else
            git commit -m "catalog update $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push
          fi
